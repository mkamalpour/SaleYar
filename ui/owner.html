<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SaleYar · Retail workspace</title>
    <link rel="stylesheet" href="/ui/assets/owner.css" />
    <script id="saleyar-runtime" type="application/json">
      __SALEYAR_RUNTIME_CONFIG__
    </script>
    <script defer src="/ui/assets/owner.js"></script>
  </head>
  <body>
    <a class="skip" href="#contentArea">Skip to content</a>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">S</span>
          <div>
            <strong>SaleYar</strong
            ><small data-i18n="workspace">Retail workspace</small>
          </div>
        </div>
        <p class="nav-label" data-i18n="workspace">Retail workspace</p>
        <nav id="navigation" aria-label="Main navigation"></nav>
        <div class="sidebar-note">
          <span class="dot"></span
          ><span data-i18n="local">Your shop. Your decisions.</span>
        </div>
      </aside>
      <main class="main-content">
        <header>
          <div class="heading">
            <div>
              <p class="eyebrow" data-i18n="intelligence">SHOP INTELLIGENCE</p>
              <h1 id="pageTitle">Overview</h1>
            </div>
            <label class="search"
              ><span aria-hidden="true">⌕</span
              ><input
                id="globalSearch"
                type="search"
                aria-label="Search products"
                placeholder="Search products…"
            /></label>
          </div>
          <div class="owner-controls">
            <label
              ><span data-i18n="shop">Shop ID</span
              ><input
                id="shopId"
                value="default"
                maxlength="64"
                pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" /></label
            ><label
              ><span data-i18n="budget">Budget (Toman)</span
              ><input
                id="budget"
                type="number"
                min="1"
                value="100000000"
                step="1000000" /></label
            ><label
              ><span data-i18n="goal">Optimization goal</span
              ><select id="goal">
                <option value="maximize_profit">Maximize profit</option>
                <option value="cover_customers">Cover customers</option>
                <option value="reduce_risk">Reduce risk</option>
              </select></label
            ><label
              ><span data-i18n="language">Language</span
              ><select id="lang">
                <option value="en">English</option>
                <option value="fa">فارسی</option>
              </select></label
            ><button id="uploadBtn" class="primary" data-i18n="upload">
              Upload sales file</button
            ><input
              id="fileInput"
              type="file"
              accept=".csv,.xlsx,.xls"
              hidden
            />
          </div>
        </header>
        <div class="statusbar">
          <span id="status" role="status" aria-live="polite"
            >Ready to analyze</span
          ><span data-i18n="formats">CSV / Excel · Local analysis</span>
        </div>
        <section
          id="contentArea"
          tabindex="-1"
          aria-label="Dashboard content"
        ></section>
      </main>
    </div>
    <button
      id="llmToggle"
      class="advisor-toggle"
      aria-controls="llmPanel"
      aria-expanded="false"
      data-i18n="advisor"
    >
      Ask advisor
    </button>
    <section id="llmPanel" class="llm-panel" aria-label="Shop advisor" hidden>
      <div class="llm-header">
        <div>
          <strong data-i18n="advisor">Shop advisor</strong
          ><small data-i18n="advisorHint"
            >Answers grounded in your analysis</small
          >
        </div>
        <button id="closeLlm" aria-label="Close advisor">×</button>
      </div>
      <div
        id="llmMessages"
        class="llm-messages"
        role="log"
        aria-live="polite"
      ></div>
      <form id="chatForm" class="llm-input-area">
        <input
          id="llmInput"
          aria-label="Question for advisor"
          placeholder="Ask about stock, orders or profit…"
          maxlength="4000"
          required
        /><button id="llmSend" class="primary" data-i18n="send">Send</button>
      </form>
    </section>
    <div id="loadingOverlay" class="loading-overlay" hidden>
      <div class="loading-spinner" role="status">
        <div class="spinner"></div>
        <h2 data-i18n="analyzing">Analyzing your shop</h2>
        <p data-i18n="wait">
          Preparing recommendations. You can cancel waiting.
        </p>
        <button id="cancelAnalysis" data-i18n="cancel">Cancel</button>
      </div>
    </div>
  </body>
</html>
